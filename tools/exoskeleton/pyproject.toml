[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-exoskeleton"
version = "0.1.0"
description = "Standalone founder-ops exoskeleton for local project support tooling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Vibecode International Team"}
]
dependencies = [
    "click>=8.1.0,<9.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[project.scripts]
project-exo = "project_exoskeleton.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["project_exoskeleton*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
